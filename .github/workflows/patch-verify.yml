# Verification for the backfill-throttle-retry patch.
#
# The patch is small but two of its four hunks fail SILENTLY if they regress:
#
#   - backfill.go does not import "time" upstream. Miss that hunk and the build
#     breaks loudly, which is fine -- `go build` covers it.
#   - config/upgrade.go must register the new keys. Miss THAT and everything still
#     compiles and runs; the bridge just deletes the settings from config.yaml the
#     first time it rewrites it, and backfill silently reverts to no pacing and no
#     retry. Nothing about that is visible until Discord rate-limits you.
#
# So the round-trip check below is the important one: it writes a sentinel value,
# makes the bridge upgrade its own config offline (-g needs no homeserver), and
# fails if the value did not survive.
name: verify patch
on:
  push:
    branches: [fork, backfill-throttle-retry, dm-relay]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y libolm-dev

      - name: gofmt
        run: |
          out=$(gofmt -l backfill.go portal.go config/bridge.go config/upgrade.go)
          if [ -n "$out" ]; then echo "not gofmt-clean:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Build
        run: go build -o /tmp/mautrix-discord

      - name: Config upgrade round-trip keeps the new keys
        run: |
          cp example-config.yaml /tmp/config.yaml
          sed -i 's/^        fetch_delay_ms: 500$/        fetch_delay_ms: 1234/' /tmp/config.yaml
          sed -i 's/^    domain: example.com$/    domain: test.local/' /tmp/config.yaml
          /tmp/mautrix-discord -c /tmp/config.yaml -r /tmp/registration.yaml -g
          echo "--- backfill block after upgrade ---"
          sed -n '/^        max_guild_members:/,/^$/p' /tmp/config.yaml
          grep -q 'fetch_delay_ms: 1234'    /tmp/config.yaml || { echo "FAIL: fetch_delay_ms stripped or reset"; exit 1; }
          grep -q 'retry_interval_ms: 30000' /tmp/config.yaml || { echo "FAIL: retry_interval_ms stripped"; exit 1; }
          grep -q 'max_retries: 5'           /tmp/config.yaml || { echo "FAIL: max_retries stripped"; exit 1; }
          echo "OK: all three keys survived the config upgrade"

      - name: DM relay keys survive the config upgrade
        run: |
          cp example-config.yaml /tmp/relay-config.yaml
          sed -i 's/^    domain: example.com$/    domain: test.local/' /tmp/relay-config.yaml
          # Flip both scalars away from their defaults so a reset is distinguishable
          # from a value that merely happens to match.
          sed -i 's/^        enabled: false$/        enabled: true/'   /tmp/relay-config.yaml
          sed -i 's/^        admin_only: true$/        admin_only: false/' /tmp/relay-config.yaml
          /tmp/mautrix-discord -c /tmp/relay-config.yaml -r /tmp/relay-registration.yaml -g
          echo "--- relay block after upgrade ---"
          sed -n '/^    relay:/,/^    [a-z]/p' /tmp/relay-config.yaml
          grep -q 'admin_only: false' /tmp/relay-config.yaml || { echo "FAIL: relay.admin_only stripped or reset"; exit 1; }
          grep -q 'm.text: ' /tmp/relay-config.yaml           || { echo "FAIL: relay.message_formats stripped"; exit 1; }
          echo "OK: relay config survived the config upgrade"

      - name: DM relay is actually wired into the send path
        run: |
          # Guards against the config existing while nothing reads it -- the
          # failure mode that would look exactly like "relay is enabled but
          # nothing happens".
          grep -q 'dmRelayUser' portal.go            || { echo "FAIL: dmRelayUser missing"; exit 1; }
          grep -q 'FormatRelayMessage' portal.go     || { echo "FAIL: relay formatting not applied in portal.go"; exit 1; }
          grep -q 'relayOrigin.MXID' portal.go       || { echo "FAIL: relayed messages would be misattributed in the database"; exit 1; }
          echo "OK: relay wired into portal.go"

      - name: Fork must not bump the database schema version
        run: |
          # The whole point of creating lhns_dm_relay outside the migration system
          # is that `version` stays at whatever upstream knows, so the unforked
          # image can still run against a database this fork has used. A new file
          # in database/upgrades/ would silently take that away.
          newest=$(ls database/upgrades/ | grep -oE '^[0-9]+' | sort -n | tail -1)
          echo "newest migration: $newest"
          if [ "$newest" -gt 24 ]; then
            echo "FAIL: migration $newest added -- this breaks downgrading to upstream v0.7.7."
            echo "Persist fork state in its own CREATE TABLE IF NOT EXISTS instead (see dmrelay.go)."
            exit 1
          fi
          grep -q 'CREATE TABLE IF NOT EXISTS lhns_dm_relay' dmrelay.go || { echo "FAIL: relay table not self-created"; exit 1; }
          if grep -rn 'ALTER TABLE portal' --include=*.go --include=*.sql . ; then
            echo "FAIL: fork must not alter upstream tables"; exit 1
          fi
          echo "OK: schema version untouched, fork state lives in its own table"
